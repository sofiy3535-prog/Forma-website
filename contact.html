<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти — FORMA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">FORMA</a>
            <nav class="main-nav">
                <a href="index.html">Головна</a>
                <a href="shop.html">Магазин</a>
                <a href="about.html">Про нас</a>
                <a href="contact.html" class="active">Контакти</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <h1>Зв'яжіться з нами</h1>
        </section>

        <section class="section">
            <div class="container">
                <div class="contact-layout">
                    
                    <div class="contact-info">
                        <p>
                            <strong>Шоурум:</strong>
                            вул. Рейтарська, 22,<br>
                            м. Київ, 01030
                        </p>
                        <p>
                            <strong>Телефон:</strong>
                            +380 (99) 555 44 33
                        </p>
                        <p>
                            <strong>Для клієнтів:</strong>
                            <a href="mailto:clients@forma.ua">clients@forma.ua</a>
                        </p>
                        <p>
                            <strong>Соціальні мережі:</strong>
                            <a href="#" target="_blank">Instagram</a> / 
                            <a href="#" target="_blank">Pinterest</a>
                        </p>
                    </div>

                    <form action="#" method="POST" class="contact-form">
                        <div class="form-group">
                            <label for="name">Ваше Ім'я</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Ваш Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Повідомлення</label>
                            <textarea id="message" name="message" required></textarea>
                        </div>
                        <button type="submit" class="button">Відправити (Імітація)</button>
                    </form>

                </div>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <h2 class="map-title">Наш Шоурум</h2>
                <div class="map-container">
                    <iframe 
                        src="https://maps.google.com/maps?q=вул.%20Рейтарська,%2022,%20Київ&t=&z=17&ie=UTF8&iwloc=&output=embed" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2025 FORMA. Всі права захищені.</p>
        </div>
    </footer>

</body>
</html>
